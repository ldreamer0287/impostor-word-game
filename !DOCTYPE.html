<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Impostor Multiplayer Game</title>

<style>
body {
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}
.box {
    background: #1e293b;
    padding: 25px;
    border-radius: 12px;
    max-width: 420px;
    margin: auto;
}
input, button, select {
    width: 90%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;
    font-size: 16px;
}
button {
    background: #22c55e;
    cursor: pointer;
}
.danger {
    background: #ef4444;
    color: white;
}
.hint {
    color: #93c5fd;
}
</style>
</head>

<body>

<h1>🕵️ Impostor Word Game</h1>

<div class="box">

<!-- SETUP -->
<div id="setup">
    <input type="number" id="players" min="3" placeholder="Number of Players">
    <button onclick="startGame()">Start Game</button>
</div>

<!-- PLAYER VIEW -->
<div id="playerView" style="display:none;">
    <h3 id="playerTitle"></h3>
    <p id="word"></p>
    <p class="hint" id="hint"></p>
    <button onclick="nextPlayer()">Next Player</button>
</div>

<!-- HOST HINT CONTROL -->
<div id="hostHints" style="display:none;">
    <h3>👑 Host: Add Hint</h3>
    <input id="newHint" placeholder="Enter a new hint">
    <button onclick="addHint()">Add Hint</button>

    <h3>Hints</h3>
    <ul id="hintList"></ul>

    <button class="danger" onclick="goToVoting()">Start Voting</button>
</div>

<!-- VOTING -->
<div id="voting" style="display:none;">
    <h3>🗳️ Vote the Impostor</h3>
    <select id="voteSelect"></select>
    <button class="danger" onclick="submitVote()">Submit Vote</button>
</div>

<!-- RESULT -->
<div id="result" style="display:none;">
    <h2 id="resultText"></h2>
    <p id="impostorInfo"></p>
    <button onclick="location.reload()">Play Again</button>
</div>

</div>

<script>
const wordPairs = [
    { common: "Football", impostor: "Cricket", hint: "Popular outdoor sports" },
    { common: "Apple", impostor: "Orange", hint: "Fruits" },
    { common: "Bus", impostor: "Train", hint: "Public transport" },
    { common: "Teacher", impostor: "Student", hint: "School people" },
    { common: "Laptop", impostor: "Mobile", hint: "Electronic devices" }
];

let totalPlayers;
let currentPlayer = 0;
let impostor;
let selectedPair;
let hints = [];

function startGame() {
    totalPlayers = parseInt(document.getElementById("players").value);
    if (totalPlayers < 3) {
        alert("At least 3 players required!");
        return;
    }

    selectedPair = wordPairs[Math.floor(Math.random() * wordPairs.length)];
    impostor = Math.floor(Math.random() * totalPlayers);
    hints.push(selectedPair.hint); // first hint

    document.getElementById("setup").style.display = "none";
    document.getElementById("playerView").style.display = "block";
    showPlayer();
}

function showPlayer() {
    document.getElementById("playerTitle").innerText =
        "Player " + (currentPlayer + 1) + " – Look at your word";

    document.getElementById("word").innerText =
        currentPlayer === impostor
        ? selectedPair.impostor
        : selectedPair.common;

    document.getElementById("hint").innerText =
        "Hint: " + hints.join(" | ");
}

function nextPlayer() {
    currentPlayer++;
    if (currentPlayer >= totalPlayers) {
        document.getElementById("playerView").style.display = "none";
        document.getElementById("hostHints").style.display = "block";
        updateHintList();
    } else {
        showPlayer();
    }
}

/* HOST ADDS HINT */
function addHint() {
    const hintInput = document.getElementById("newHint");
    if (!hintInput.value) return;

    hints.push(hintInput.value);
    hintInput.value = "";
    updateHintList();
}

function updateHintList() {
    const list = document.getElementById("hintList");
    list.innerHTML = "";
    hints.forEach((h, i) => {
        const li = document.createElement("li");
        li.className = "hint";
        li.innerText = "Round " + (i + 1) + ": " + h;
        list.appendChild(li);
    });
}

/* MOVE TO VOTING */
function goToVoting() {
    document.getElementById("hostHints").style.display = "none";
    setupVoting();
}

function setupVoting() {
    document.getElementById("voting").style.display = "block";
    const select = document.getElementById("voteSelect");
    select.innerHTML = "";

    for (let i = 0; i < totalPlayers; i++) {
        const option = document.createElement("option");
        option.value = i;
        option.text = "Player " + (i + 1);
        select.appendChild(option);
    }
}

function submitVote() {
    const votedPlayer = parseInt(document.getElementById("voteSelect").value);

    document.getElementById("voting").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("resultText").innerText =
        votedPlayer === impostor ? "🎉 Impostor Caught!" : "😈 Impostor Escaped!";

    document.getElementById("impostorInfo").innerText =
        "Impostor was Player " + (impostor + 1);
}
</script>

</body>
</html>
