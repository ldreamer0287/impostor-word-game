<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Impostor Multiplayer Online</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>

<body>

<h1>🕵️ Impostor Word Game</h1>

<div class="box">

<div id="home">
    <input id="name" placeholder="Your Name">
    <input id="room" placeholder="Room Code">
    <button onclick="createRoom()">Create Room (Host)</button>
    <button onclick="joinRoom()">Join Room</button>
</div>

<div id="game" style="display:none;">
    <h3 id="status"></h3>
    <p id="word"></p>
    <p class="hint" id="hint"></p>
</div>

<div id="hostPanel" style="display:none;">
    <input id="newHint" placeholder="Add Hint">
    <button onclick="addHint()">Add Hint</button>
    <button class="danger" onclick="startVote()">Start Voting</button>
</div>

</div>

<script>
// 🔴 PASTE YOUR FIREBASE CONFIG HERE
var firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT.firebaseio.com",
    projectId: "YOUR_PROJECT"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomCode, playerName, isHost = false;
let words = [
    { common: "Football", impostor: "Cricket", hint: "Sports" },
    { common: "Apple", impostor: "Orange", hint: "Fruits" }
];

function createRoom() {
    playerName = name.value;
    roomCode = Math.random().toString(36).substr(2,5);
    isHost = true;

    const pair = words[Math.floor(Math.random()*words.length)];
    const impostor = Math.floor(Math.random()*4);

    db.ref("rooms/"+roomCode).set({
        host: playerName,
        pair,
        impostor,
        hints: [pair.hint],
        players: {}
    });

    join();
}

function joinRoom() {
    playerName = name.value;
    roomCode = room.value;
    join();
}

function join() {
    document.getElementById("home").style.display = "none";
    document.getElementById("game").style.display = "block";

    db.ref("rooms/"+roomCode+"/players").push(playerName);

    db.ref("rooms/"+roomCode).on("value", snap => {
        const data = snap.val();
        if (!data) return;

        const playerIndex = Object.values(data.players).indexOf(playerName);
        const word = playerIndex === data.impostor
            ? data.pair.impostor
            : data.pair.common;

        document.getElementById("word").innerText = "Your word: " + word;
        document.getElementById("hint").innerText =
            "Hints: " + data.hints.join(" | ");

        if (isHost) document.getElementById("hostPanel").style.display = "block";
    });
}

function addHint() {
    const hint = newHint.value;
    db.ref("rooms/"+roomCode+"/hints").push(hint);
    newHint.value = "";
}

function startVote() {
    alert("Voting phase started!");
}
</script>

</body>
</html>
